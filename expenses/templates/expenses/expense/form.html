{% extends "expenses/base.html" %}

{% block content %}

<h2 class="mb-4">

Add Expense

</h2>

<div class="card shadow-sm">

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Title
                </label>

                {{ form.title }}

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Amount
                </label>

                {{ form.amount }}

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Category
                </label>

                {{ form.category }}

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Payment Method
                </label>

                {{ form.payment_method }}

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Expense Date
                </label>

                {{ form.expense_date }}

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                {{ form.description }}

            </div>

            <div class="d-grid">

                <button class="btn btn-primary">

                    Save Expense

                </button>

            </div>

            

        </form>

    </div>

</div>

{% endblock %}

{% extends "expenses/base.html" %}

{% block content %}

<h2 class="mb-4">

    Add Budget

</h2>

<div class="card shadow-sm">

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">

                    Category

                </label>

                {{ form.category }}

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Amount

                </label>

                {{ form.amount }}

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Month

                </label>

                {{ form.month }}

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Year

                </label>

                {{ form.year }}

            </div>

            <div class="d-grid">

                <button class="btn btn-primary">

                    Save Budget

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}

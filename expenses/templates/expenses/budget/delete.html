{% extends "expenses/base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body">

                <h3 class="mb-3">

                    Delete Budget

                </h3>

                <p>

                    Are you sure you want to delete

                    <strong>

                        {% if object.category %}
                            {{ object.category.name }}
                        {% else %}
                            Overall Budget
                        {% endif %}

                    </strong>

                    for

                    <strong>

                        {{ object.month }}/{{ object.year }}

                    </strong>?

                </p>

                <form method="post">

                    {% csrf_token %}

                    <button class="btn btn-danger">

                        Yes, Delete

                    </button>

                    <a href="{% url 'budget-list' %}"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
